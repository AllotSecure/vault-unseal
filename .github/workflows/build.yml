name: Build Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
  workflow_run:
    workflows: ["Tests"]
    branches: [master, allot]
    types:
      - completed

jobs:
  release:
    name: Release GitHub tag
    runs-on: 'ubuntu-latest'
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag || inputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Bump version and push tag
        id: tag_version
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: mathieudutour/github-tag-action@v6.2
        with:
          default_bump: minor
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release with Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag || inputs.version }}
          name: Release ${{ steps.tag_version.outputs.new_tag || inputs.version }}
          body: ${{ steps.tag_version.outputs.changelog || 'Manual release' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to GitHub
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ghcr.io/omegion/vault-unseal:latest,ghcr.io/omegion/vault-unseal:${{ needs.release.outputs.new_tag }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.release.outputs.new_tag }}
